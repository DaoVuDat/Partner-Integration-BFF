services:
  rabbitmq:
    image: rabbitmq:4.3-management
    container_name: shop-rabbitmq
    ports:
#      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  verification-mock:
    container_name: shop-verification-mock
    build:
      context: . 
      dockerfile: src/Verification.Mock/Dockerfile
    ports:
      - "8081:8080"

  bff-api:
    container_name: shop-bff-api
    build:
      context: .
      dockerfile: src/Bff.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672
      Verification__BaseUrl: http://verification-mock:8080
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:8080/health/live" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      rabbitmq:
        condition: service_healthy
      verification-mock:
        condition: service_started
